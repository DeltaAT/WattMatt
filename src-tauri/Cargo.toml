[package]
name = "wattmatt"
version = "0.1.0"
description = "Offline tournament management and beamer presentation app"
authors = ["WattMatt contributors"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for SetThreadExecutionState — see src/power.rs. WattMatt ships to
# Windows 11 exclusively, but keeping the dependency target-gated means the
# crate still compiles elsewhere for a quick `cargo check`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
