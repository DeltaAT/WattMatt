[package]
name = "wattmatt"
version = "0.1.0"
description = "Offline tournament management and beamer presentation app"
authors = ["WattMatt contributors"]
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The native open/save dialogs of issue #9. A dialog has to be the real Windows
# one — a host looking for a tournament on a USB stick needs the sidebar, the
# recent places and the file name completion they already know. It is bundled,
# talks to no network, and the capability that grants it is host-only.
tauri-plugin-dialog = "2"

# One WattMatt at a time (src-tauri/src/launch.rs). Registering the .wattmatt
# file association means a double-click can start the app while it is already
# running; two processes would each open a beamer window and autosave the same
# file from two places, the later write winning. The plugin hands the path to
# the running instance and exits. Local IPC only — a named pipe, no network.
tauri-plugin-single-instance = "2"

# Only for SetThreadExecutionState — see src/power.rs. WattMatt ships to
# Windows 11 exclusively, but keeping the dependency target-gated means the
# crate still compiles elsewhere for a quick `cargo check`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
